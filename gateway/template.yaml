AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Recipe Picker MCP Server - Part 1: AgentCore Gateway
  Deploys a Lambda function with recipe tools and exposes them
  as an MCP server via AgentCore Gateway.

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  # ============================================================
  # Lambda Function — contains our tool logic
  # ============================================================
  RecipeToolsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: ../
      Description: Recipe picker MCP tools - invoked by AgentCore Gateway
      MemorySize: 256
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - gateway/handler.ts

  # ============================================================
  # IAM Role — lets AgentCore Gateway invoke our Lambda
  # ============================================================
  GatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-gateway-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RecipeToolsFunction.Arn

  # ============================================================
  # AgentCore Gateway — the MCP server endpoint
  # ============================================================
  RecipeGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: recipe-picker
      Description: MCP server for recipe discovery and grocery list generation
      AuthorizerType: NONE
      ProtocolType: MCP
      ProtocolConfiguration:
        Mcp:
          SupportedVersions:
            - "2025-03-26"
            - "2025-11-25"
            - "2026-07-28"
      RoleArn: !GetAtt GatewayExecutionRole.Arn

  # ============================================================
  # Gateway Target — points to our Lambda with tool schemas
  # ============================================================
  RecipeToolsTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref RecipeGateway
      Name: RecipeTools
      Description: Lambda target with recipe discovery, details, and grocery list tools
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt RecipeToolsFunction.Arn
            ToolSchema:
              InlinePayload:
                - Name: discover_recipes
                  Description: >
                    Search for recipes by cuisine type and/or dietary preference.
                    Returns a summary list of matching recipes with IDs you can use
                    to get full details.
                  InputSchema:
                    Type: object
                    Description: Filters for recipe search
                    Properties:
                      cuisine:
                        Type: string
                        Description: >
                          Cuisine type to filter by (e.g. italian, mexican, indian,
                          chinese, thai)
                      dietary:
                        Type: string
                        Description: >
                          Dietary preference to filter by (e.g. vegetarian, vegan,
                          gluten-free)
                      maxResults:
                        Type: integer
                        Description: Maximum number of recipes to return (default 5)
                - Name: get_recipe_details
                  Description: >
                    Get the full details for a specific recipe including all
                    ingredients with amounts and step-by-step cooking instructions.
                  InputSchema:
                    Type: object
                    Description: Recipe identifier
                    Properties:
                      recipeId:
                        Type: string
                        Description: >
                          The recipe ID (from discover_recipes results) to get details for
                    Required:
                      - recipeId
                - Name: get_grocery_list
                  Description: >
                    Generate a consolidated grocery/shopping list from one or more
                    recipes. Deduplicates ingredients across recipes and sorts
                    alphabetically.
                  InputSchema:
                    Type: object
                    Description: List of recipe IDs to generate a grocery list for
                    Properties:
                      recipeIds:
                        Type: array
                        Description: >
                          Array of recipe IDs to include in the grocery list
                        Items:
                          Type: string
                    Required:
                      - recipeIds

Outputs:
  GatewayUrl:
    Description: The MCP server endpoint URL — use this in ChatGPT or Claude Desktop
    Value: !GetAtt RecipeGateway.GatewayUrl
  GatewayId:
    Description: The Gateway identifier
    Value: !Ref RecipeGateway
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt RecipeToolsFunction.Arn
