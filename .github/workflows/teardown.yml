name: Teardown PR Environment

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    name: Teardown PR Environment
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete PR stack
        run: |
          STACK_NAME="recipe-embedding-pipeline-pr-${{ github.event.number }}"
          echo "Deleting temporary stack: $STACK_NAME"

          # Check if stack exists before attempting delete
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" 2>/dev/null; then
            sam delete \
              --stack-name "$STACK_NAME" \
              --no-prompts \
              --s3-bucket ${{ vars.ARTIFACTS_BUCKET }} \
              --region ${{ vars.AWS_REGION }}
            echo "✓ Stack deleted"
          else
            echo "✓ Stack does not exist, nothing to clean up"
          fi
